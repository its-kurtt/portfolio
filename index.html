    <title>Kurt — Portfolio</title>
    <style>
      html,
      body {
        margin: 0;
        background: #08090d;
        color: #f5f3ee;
      }

      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background:
          radial-gradient(
            ellipse 70% 62% at 50% 46%,
            rgba(24, 39, 66, 0.56) 0%,
            rgba(8, 9, 13, 0.96) 72%
          ),
          #08090d;
        font-family:
          Manrope,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        transition:
          opacity 480ms cubic-bezier(0.22, 1, 0.36, 1),
          transform 520ms cubic-bezier(0.22, 1, 0.36, 1),
          visibility 480ms linear;
      }

      #boot-loader::before,
      #boot-loader::after {
        content: '';
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
        filter: blur(96px);
      }

      #boot-loader::before {
        width: 42vw;
        height: 42vw;
        top: -14vw;
        left: -12vw;
        background: rgba(242, 99, 34, 0.2);
      }

      #boot-loader::after {
        width: 38vw;
        height: 38vw;
        bottom: -14vw;
        right: -10vw;
        background: rgba(245, 189, 42, 0.16);
      }

      #boot-loader.is-exiting {
        opacity: 0;
        transform: scale(1.04);
        visibility: hidden;
        pointer-events: none;
      }

      .boot-core {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 24px;
        animation: boot-enter 520ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .boot-aperture {
        position: relative;
        width: 112px;
        height: 112px;
        display: grid;
        place-items: center;
        margin-bottom: 24px;
      }

      .boot-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
      }

      .boot-ring.is-outer {
        border: 1px solid rgba(245, 243, 238, 0.12);
        border-top-color: #f5bd2a;
        border-right-color: rgba(245, 189, 42, 0.38);
        animation: boot-spin 1.85s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
      }

      .boot-ring.is-inner {
        inset: 12px;
        border: 1px solid rgba(245, 243, 238, 0.08);
        border-bottom-color: #f26322;
        border-left-color: rgba(242, 99, 34, 0.35);
        animation: boot-spin-rev 2.6s linear infinite;
      }

      .boot-halo {
        position: absolute;
        inset: 22px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(245, 189, 42, 0.22) 0%,
          rgba(242, 99, 34, 0.08) 52%,
          transparent 76%
        );
        animation: boot-breathe 2.2s ease-in-out infinite;
      }

      .boot-logo {
        position: relative;
        z-index: 2;
        width: 44px;
        height: 51px;
        object-fit: contain;
        animation: boot-logo-float 2.2s ease-in-out infinite;
      }

      .boot-name {
        font-family: Archivo, 'Segoe UI', sans-serif;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.32em;
        text-indent: 0.32em;
        color: #f5f3ee;
        margin: 0 0 8px;
      }

      .boot-role {
        display: block;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.14em;
        color: #9ca5b6;
        margin: 0 0 22px;
      }

      .boot-rail {
        position: relative;
        width: 196px;
        height: 2px;
        border-radius: 999px;
        background: rgba(245, 243, 238, 0.14);
        overflow: hidden;
        margin-bottom: 12px;
      }

      .boot-rail-bar {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: linear-gradient(90deg, #f26322 0%, #f5bd2a 70%, #f5f3ee 100%);
        transform-origin: left center;
        animation: boot-progress 1.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      .boot-status {
        display: block;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.18em;
        color: #f5bd2a;
        margin: 0;
      }

      @keyframes boot-enter {
        from {
          opacity: 0;
          transform: translate3d(0, 10px, 0) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translate3d(0, 0, 0) scale(1);
        }
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes boot-spin-rev {
        to {
          transform: rotate(-360deg);
        }
      }

      @keyframes boot-breathe {
        0%,
        100% {
          opacity: 0.65;
          transform: scale(0.94);
        }
        50% {
          opacity: 1;
          transform: scale(1.06);
        }
      }

      @keyframes boot-logo-float {
        0%,
        100% {
          transform: translate3d(0, 0, 0);
        }
        50% {
          transform: translate3d(0, -3px, 0);
        }
      }

      @keyframes boot-progress {
        0% {
          transform: scaleX(0.06);
        }
        65% {
          transform: scaleX(0.84);
        }
        100% {
          transform: scaleX(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-loader,
        .boot-core,
        .boot-ring,
        .boot-halo,
        .boot-logo,
        .boot-rail-bar {
          animation: none !important;
          transition: none !important;
        }
        .boot-rail-bar {
          transform: scaleX(0.75);
        }
      }
    </style>
  </head>
  <body>
    <div
      id="boot-loader"
      role="status"
      aria-live="polite"
      aria-label="Loading Kurt portfolio"
    >
      <div class="boot-core">
        <div class="boot-aperture" aria-hidden="true">
          <span class="boot-halo"></span>
          <span class="boot-ring is-outer"></span>
          <span class="boot-ring is-inner"></span>
          <img
            class="boot-logo"
            src="/brand/kurt-logo.png"
            width="44"
            height="51"
            alt=""
          />
        </div>
        <span class="boot-name">KURT</span>
        <span class="boot-role">3D ARTIST · FRONT-END DEVELOPER · WEB DESIGNER</span>
        <div class="boot-rail" aria-hidden="true">
          <span class="boot-rail-bar"></span>
        </div>
        <span class="boot-status">ENTERING STUDIO</span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
